    html += `<div class="empty">Registra qui le ore fatte allo sci club, alla scuola sci e allo sci club extra: i totali restano sempre separati.</div>`;
  } else {
    html += `<div class="section-title" style="margin-top:14px">Registrazioni</div>`;
  }
  lista.forEach(x=>{
    html += `<div class="card" onclick="openSciForm('${x.id}')">
      <div class="row-between">
        <div>
          <div class="name">${esc(labelSci(x.categoria))}</div>
          <div class="sub">${fmtData(x.data)}</div>
          ${x.note?`<div style="font-size:13px; margin-top:5px">${esc(x.note)}</div>`:''}
        </div>
        <div style="text-align:right">
          <div style="font-weight:700; color:var(--forest-deep); white-space:nowrap">${fmtOre(x.ore)} h</div>
          <button class="close-btn" style="background:none; margin-top:6px" onclick="event.stopPropagation(); delSci('${x.id}')">🗑</button>
        </div>
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function openSciForm(id){
  const x = id ? DB.sci.find(r=>r.id===id) : null;
  const opzioni = CATEGORIE_SCI.map(c=>`<option value="${c.id}" ${x && x.categoria===c.id ? 'selected' : ''}>${esc(c.label)}</option>`).join('');
  openSheet(x ? 'Modifica ore' : 'Nuove ore sci', `
    <div class="field"><div class="field-label">Data</div>
      <input class="input" type="date" id="f-data" value="${x ? esc(x.data) : todayISO()}"></div>
    <div class="field"><div class="field-label">Tipo di ore</div>
      <select class="input" id="f-cat">${opzioni}</select></div>
    <div class="field"><div class="field-label">Ore</div>
      <input class="input" type="number" inputmode="decimal" step="0.25" min="0" id="f-ore" placeholder="es. 2 oppure 1.5" value="${x ? esc(x.ore) : ''}"></div>
    <div class="field"><div class="field-label">Note (opzionale)</div>
      <textarea class="input" id="f-note">${x ? esc(x.note||'') : ''}</textarea></div>
    <button class="btn btn-primary" onclick="saveSci('${x ? x.id : ''}')">Salva</button>
  `);
}
function saveSci(id){
  const data = document.getElementById('f-data').value || todayISO();
  const categoria = document.getElementById('f-cat').value;
  const ore = Number(String(document.getElementById('f-ore').value).replace(',','.'));
  const note = document.getElementById('f-note').value;
  if(!(ore>0)){ toast('Scrivi le ore'); return; }
  if(id){
    const x = DB.sci.find(r=>r.id===id);
    if(x){ x.data = data; x.categoria = categoria; x.ore = ore; x.note = note; }
  } else {
    DB.sci.unshift({ id: uid(), data, categoria, ore, note });
  }
  persist('sci');
  closeSheet();
  render();
}
function delSci(id){
  openConfirm('Eliminare questa registrazione?', ()=>{
    DB.sci = DB.sci.filter(r=>r.id!==id);
    persist('sci');
    render();
  });
}

// ---------- sheet (modal) ----------
function openSheet(title, bodyHtml){
  document.getElementById('sheet').innerHTML = `
    <div class="sheet-head">
      <div class="display sheet-title">${esc(title)}</div>
      <button class="close-btn" onclick="closeSheet()">✕</button>
    </div>
    ${bodyHtml}`;
  document.getElementById('overlay').classList.add('show');
}
function closeSheet(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click', closeSheet);

function openConfirm(message, onConfirm){
  openSheet('Conferma', `
    <div style="font-size:14.5px; margin-bottom:20px; color:var(--ink); line-height:1.5">${esc(message)}</div>
    <div class="btn-row" style="margin-top:0">
      <button class="btn btn-ghost" onclick="closeSheet()">Annulla</button>
      <button class="btn btn-danger" id="confirm-yes-btn">Conferma</button>
    </div>
  `);
  document.getElementById('confirm-yes-btn').onclick = function(){
    closeSheet();
    onConfirm();
  };
}
function toast(msg){
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed; left:16px; right:16px; bottom:calc(96px + env(safe-area-inset-bottom)); background:var(--forest-deep); color:#fff; padding:13px 16px; border-radius:12px; font-size:14px; font-weight:600; z-index:60; text-align:center; box-shadow:0 6px 20px rgba(0,0,0,.25)';
  document.body.appendChild(t);
  setTimeout(()=>{ t.remove(); }, 2800);
}

// ---------- init ----------
render();
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCt9D9Uomu3rNhDq1qDICuWnUdZJjmLlow",
  authDomain: "gestionale-422df.firebaseapp.com",
  projectId: "gestionale-422df",
  storageBucket: "gestionale-422df.firebasestorage.app",
  messagingSenderId: "821831582537",
  appId: "1:821831582537:web:51bc9804bc708c24369098"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ---- Sincronizzazione: ogni chiave "gv_" dell'app diventa un documento nella raccolta "gestionale" ----
const COLL = 'gestionale';
const ESCLUSE = new Set(['gv_annoAttivo','gv_stagioneAttiva','gv_stagioneSci','gv_barraTab','gv_ultimoBackup']); // preferenze di questo telefono
const tracciata = k => typeof k==='string' && k.indexOf('gv_')===0 && !ESCLUSE.has(k);
const hash = s => { let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return s.length+':'+h; };
const setOrig = Storage.prototype.setItem;
const ora = () => new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
const conTimeout = (p,ms=20000) => Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);

let utente = null, remoto = null, unsub = null, occupato = false, richiesto = false, tPush = null, ricaricaInAttesa = false;
const stato = { testo:'non connesso', email:'' };

function leggiMeta(){ try{ return JSON.parse(localStorage.getItem('sync_meta')||'{}'); }catch(e){ return {}; } }
function salvaMeta(m){ try{ setOrig.call(localStorage,'sync_meta',JSON.stringify(m)); }catch(e){} }
function overlayAperto(){ const o=document.getElementById('overlay'); return !!(o && o.classList.contains('show')); }
function ricarica(){
  const ultimo = Number(localStorage.getItem('sync_reloadTs')||0);
  if(Date.now()-ultimo < 8000) return; // evita cicli di ricarica
  if(overlayAperto()){ ricaricaInAttesa = true; return; }
  try{ setOrig.call(localStorage,'sync_reloadTs',String(Date.now())); }catch(e){}
  location.reload();
}
setInterval(()=>{ if(ricaricaInAttesa && !overlayAperto()){ ricaricaInAttesa=false; ricarica(); } }, 3000);

async function spingi(k, meta){
  const v = localStorage.getItem(k); if(v===null) return;
  const t = Date.now();
  await conTimeout(setDoc(doc(db,COLL,k),{ v, t, by: (utente && utente.email) || '' }));
  meta[k] = { t, h: hash(v) };
}

async function sincronizza(){
  if(!utente || remoto===null) return;
  if(occupato){ richiesto = true; return; }
  occupato = true;
  const meta = leggiMeta();
  try{
    const locali = [];
    for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(tracciata(k)) locali.push(k); }

    // dopo un ripristino da backup: i dati di questo telefono diventano quelli giusti anche online
    if(localStorage.getItem('sync_forcePush')==='1'){
      for(const k of Object.keys(remoto)){ if(tracciata(k) && !locali.includes(k)) await conTimeout(deleteDoc(doc(db,COLL,k))); }
      for(const k of locali){ await spingi(k, meta); }
      localStorage.removeItem('sync_forcePush');
      stato.testo = 'sincronizzato alle '+ora();
      return;
    }

    let cambiato = false;
    // 1) scarico le modifiche fatte da altri telefoni
    for(const k of Object.keys(remoto)){
      if(!tracciata(k)) continue;
      const rv = remoto[k] && remoto[k].v; if(typeof rv!=='string') continue;
      const rt = (remoto[k] && remoto[k].t) || 0;
      const loc = localStorage.getItem(k);
      const m = meta[k];
      if(loc===rv){ meta[k] = { t:rt, h:hash(rv) }; continue; }
      let prendi;
      if(loc===null) prendi = true;
      else if(!m) prendi = rv.length >= loc.length;      // primo accesso: vince chi ha più dati
      else if(hash(loc)!==m.h) prendi = false;            // modifica locale non ancora inviata
      else prendi = rt > m.t;
      if(prendi){ setOrig.call(localStorage,k,rv); meta[k] = { t:rt, h:hash(rv) }; cambiato = true; }
    }
    // 2) invio le mie modifiche
    for(const k of locali){
      const loc = localStorage.getItem(k); const m = meta[k];
      if(!m || hash(loc)!==m.h) await spingi(k, meta);
    }
    stato.testo = 'sincronizzato alle '+ora();
    if(cambiato) ricarica();
  }catch(e){
    console.error(e);
    stato.testo = 'non sincronizzato (riprovo appena possibile)';
  }finally{
    salvaMeta(meta);
    occupato = false;
    if(richiesto){ richiesto = false; setTimeout(sincronizza, 500); }
  }
}

function pianifica(){ clearTimeout(tPush); tPush = setTimeout(sincronizza, 2000); }
Storage.prototype.setItem = function(k,v){ setOrig.call(this,k,v); if(this===localStorage && tracciata(k)) pianifica(); };
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') sincronizza(); });
setInterval(sincronizza, 60000); // controlla modifiche locali; non legge dal database

function avvia(user){
  utente = user; stato.email = user.email || ''; stato.testo = 'connessione…';
  if(unsub) unsub();
  unsub = onSnapshot(collection(db,COLL), snap=>{
    const r = {}; snap.forEach(d=>{ r[d.id] = d.data(); });
    remoto = r; sincronizza();
  }, err=>{
    console.error(err);
    stato.testo = (err && err.code==='permission-denied') ? 'accesso negato dalle regole del database' : 'database non raggiungibile';
  });
}
function ferma(){
  if(unsub){ unsub(); unsub = null; }
  utente = null; remoto = null; stato.email = ''; stato.testo = 'non connesso';
}

// ---- Schermata di accesso ----
function messaggioErrore(ex){
  const c = (ex && ex.code) || '';
  if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(c)) return 'Email o password non corrette.';
  if(c==='auth/too-many-requests') return 'Troppi tentativi: riprova tra qualche minuto.';
  if(c==='auth/network-request-failed') return 'Nessuna connessione.';
  return 'Accesso non riuscito ('+(c||'errore')+').';
}
function nascondiLogin(){ const el=document.getElementById('cloud-login'); if(el) el.remove(); }
function mostraLogin(){
  if(document.getElementById('cloud-login')) return;
  const el = document.createElement('div');
  el.id = 'cloud-login';
  el.style.cssText = 'position:fixed; inset:0; z-index:10000; background:var(--bg,#F5F2EA); display:flex; align-items:center; justify-content:center; padding:24px; overflow:auto;';
  el.innerHTML = `<div style="width:100%; max-width:380px">
    <div class="display" style="font-size:30px; margin-bottom:6px">Aree verdi</div>
    <div style="font-size:14px; color:var(--ink-soft); margin-bottom:20px; line-height:1.5">Accedi per salvare i dati online e ritrovarli su ogni telefono.</div>
    <div class="field"><div class="field-label">Email</div>
      <input class="input" id="cl-email" type="email" autocomplete="username" autocapitalize="none" autocorrect="off"></div>
    <div class="field"><div class="field-label">Password</div>
      <input class="input" id="cl-pass" type="password" autocomplete="current-password"></div>
    <div id="cl-err" style="color:var(--rust); font-size:13px; min-height:18px; margin:4px 0 10px"></div>
    <button class="btn btn-primary" id="cl-go">Accedi</button>
    <button class="btn btn-ghost" id="cl-skip" style="margin-top:10px">Continua senza accedere</button>
  </div>`;
  document.body.appendChild(el);
  const go = el.querySelector('#cl-go'), err = el.querySelector('#cl-err');
  go.onclick = async ()=>{
    const e = el.querySelector('#cl-email').value.trim(), p = el.querySelector('#cl-pass').value;
    if(!e || !p){ err.textContent = 'Scrivi email e password.'; return; }
    err.textContent = ''; go.disabled = true; go.textContent = 'Accesso…';
    try{ await signInWithEmailAndPassword(auth, e, p); }
    catch(ex){ err.textContent = messaggioErrore(ex); go.disabled = false; go.textContent = 'Accedi'; }
  };
  el.querySelector('#cl-pass').addEventListener('keydown', ev=>{ if(ev.key==='Enter') go.click(); });
  el.querySelector('#cl-skip').onclick = nascondiLogin;
}

onAuthStateChanged(auth, user=>{
  if(user){ nascondiLogin(); avvia(user); }
  else { ferma(); mostraLogin(); }
});

window.cloud = {
  get stato(){ return stato; },
  sincronizzaOra: ()=> sincronizza(),
  esci: ()=> signOut(auth),
  accedi: ()=> mostraLogin()
};
</script>

</body>
