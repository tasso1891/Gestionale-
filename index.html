<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aree Verdi">
<meta name="theme-color" content="#28402B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Gestionale Aree Verdi</title>
<style>
:root{
  --bg:#F5F2EA; --card:#FFFFFF; --ink:#20261C; --ink-soft:#5C6555;
  --forest:#28402B; --forest-deep:#1B2E1E; --sage:#7C9268; --sage-light:#E4E9DA;
  --rust:#C1622D; --rust-light:#F4E1D3; --ochre:#C99A2E; --ochre-light:#F5EAD1;
  --blu:#3E6E9C; --blu-light:#E1EBF2; --verde-saldo:#3D8A4E; --verde-saldo-light:#DFF0E2;
  --line:#E4DFD1;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  height:100%; overflow:hidden;}
@font-face{font-family:'SG'; src:local('Space Grotesk');}
.display{font-family:'Space Grotesk',-apple-system,sans-serif; font-weight:700;}
#app{display:flex; flex-direction:column; height:100vh; height:100dvh;}
#content{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:90px;}
.page{padding:calc(16px + env(safe-area-inset-top)) 16px 8px;}
.page-title{font-size:24px; margin-bottom:2px;}
.page-sub{font-size:13px; color:var(--ink-soft); font-weight:600; margin-bottom:18px;}
.hero-title{font-size:26px; margin-top:2px;}
.date-label{font-size:13px; color:var(--ink-soft); font-weight:600; text-transform:capitalize;}

.btn{border:none; border-radius:12px; font-weight:700; font-size:15px; padding:12px 16px;
  display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; width:100%;}
.btn-primary{background:var(--forest); color:#fff;}
.btn-ghost{background:transparent; color:var(--forest); border:1.5px solid var(--forest);}
.btn-danger{background:var(--rust-light); color:var(--rust);}
.btn-subtle{background:var(--sage-light); color:var(--forest-deep);}
.btn-auto{width:auto;}
.btn-row{display:flex; gap:8px; margin-top:10px;}
.btn-row .btn{flex:1;}

.cta{width:100%; background:var(--forest); color:#fff; border:none; border-radius:14px;
  padding:15px 16px; display:flex; align-items:center; justify-content:space-between;
  margin-bottom:20px; cursor:pointer; box-shadow:0 4px 14px rgba(40,64,43,.25); font-weight:700; font-size:16px;}

.card{background:var(--card); border-radius:14px; border:1px solid var(--line); padding:13px 14px; margin-bottom:10px;}
.section-title{font-size:12.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.5px; margin-bottom:10px;}
.row-between{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.name{font-weight:700; font-size:15.5px;}
.sub{font-size:12.5px; color:var(--ink-soft); margin-top:1px;}

.pill{font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap;}
.pill-rust{color:var(--rust); background:var(--rust-light);}
.pill-ochre{color:var(--ochre); background:var(--ochre-light);}
.pill-sage{color:var(--sage); background:var(--sage-light);}

.bar{height:7px; background:var(--line); border-radius:999px; overflow:hidden; width:100%; margin:10px 0;}
.bar-fill{height:100%; border-radius:999px; transition:width .3s;}

.empty{background:var(--sage-light); border-radius:12px; padding:14px 16px; font-size:13.5px; color:var(--forest-deep); margin-top:6px;}

.field{display:block; margin-bottom:12px;}
.field-label{font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; text-transform:uppercase; letter-spacing:.4px;}
.input, select.input, textarea.input{width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid var(--line);
  font-size:16px; background:#FBFAF6; color:var(--ink); font-family:inherit;}
textarea.input{min-height:70px; resize:vertical;}

#overlay{position:fixed; inset:0; background:rgba(27,46,30,.45); z-index:50; display:none; align-items:flex-end;}
#overlay.show{display:flex;}
.sheet{background:var(--bg); width:100%; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0;
  padding:16px 18px calc(24px + env(safe-area-inset-bottom)); box-shadow:0 -8px 30px rgba(0,0,0,.2);}
.sheet-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.sheet-title{font-size:19px;}
.close-btn{background:var(--line); border:none; border-radius:999px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--ink); cursor:pointer;}

nav{position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line);
  display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:40;}
.nav-btn{flex:1; min-width:0; background:none; border:none; padding:9px 2px 8px; display:flex; flex-direction:column;
  align-items:center; gap:3px; cursor:pointer; color:#A6AC9B;}
.nav-btn.active{color:var(--forest);}
.nav-btn svg{width:21px; height:21px;}
.nav-label{font-size:10px; font-weight:600;}
.nav-btn.active .nav-label{font-weight:700;}

.chips{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
.chip{font-size:11.5px; font-weight:700; padding:5px 9px; border-radius:999px; border:1.5px solid var(--line);
  background:transparent; color:var(--ink-soft); cursor:pointer;}
.chip.active{border-color:var(--forest); background:var(--forest); color:#fff;}

.toggle-row{display:flex; gap:8px; margin-bottom:16px;}
.toggle{padding:7px 14px; border-radius:999px; border:1.5px solid var(--line); background:transparent; color:var(--ink-soft); font-weight:700; font-size:13px; cursor:pointer;}
.toggle.active{border-color:var(--forest); background:var(--forest); color:#fff;}

.link-btn{background:none; border:none; padding:0; font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:4px; cursor:pointer;}
.showall{background:none; border:none; color:var(--ink-soft); font-weight:600; font-size:13.5px; margin-top:14px; padding:6px; display:flex; align-items:center; gap:4px; cursor:pointer;}

.collapsible-body{border-top:1px solid var(--line); padding-top:12px;}
.chev{transition:transform .2s;}
.chev.open{transform:rotate(180deg);}
.today-row{display:flex; align-items:center; gap:8px; padding:8px 2px; font-size:14px;}
.history-item{font-size:13px; padding:5px 0; border-bottom:1px solid var(--line);}
.reorder-col{display:flex; flex-direction:column; gap:3px;}
.reorder-btn{background:var(--sage-light); border:none; border-radius:6px; width:26px; height:22px; font-size:11px;
  color:var(--forest); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;}
.reorder-btn:disabled{opacity:.3; cursor:default;}
.tipo-chip{display:inline-flex; align-items:center; padding:8px 13px; border-radius:999px; border:1.5px solid var(--line);
  font-size:13px; font-weight:700; color:var(--ink-soft); cursor:pointer; background:transparent; margin:0 6px 6px 0;}
.tipo-chip.active{border-color:var(--forest); background:var(--forest); color:#fff;}
.macchina-row{display:flex; gap:8px; margin-bottom:8px; align-items:center;}
</style>
</head>
<body>
<div id="app">
  <div id="content"></div>
  <nav id="nav"></nav>
</div>
<div id="overlay"><div class="sheet" id="sheet" onclick="event.stopPropagation()"></div></div>

<script>
// ---------- storage ----------
// dati sempre globali, condivisi tra tutti gli anni
const KEYS_GLOBALI = ['condomini','macchinari','privatiClienti','leleClienti'];
let DB = {condomini:[], macchinari:[], privatiClienti:[], leleClienti:[], interventiAnni:{}, privatiLavoriAnni:{}, leleLavoriAnni:{}, benzinaAnni:{}, sciAnni:{}, sciStagioni:{}, sciPagamenti:{}, fattureAnni:{}, fattureLeleAnni:{}, privatiAccontiAnni:{}, neveStagioni:{}, fattureNeveStagioni:{}};
KEYS_GLOBALI.forEach(k=>{
  try{ const raw = localStorage.getItem('gv_'+k); DB[k] = raw ? JSON.parse(raw) : []; }
  catch(e){ DB[k] = []; }
});
try{ const raw = localStorage.getItem('gv_interventiAnni'); DB.interventiAnni = raw ? JSON.parse(raw) : {}; }catch(e){ DB.interventiAnni = {}; }
try{ const raw = localStorage.getItem('gv_privatiLavoriAnni'); DB.privatiLavoriAnni = raw ? JSON.parse(raw) : {}; }catch(e){ DB.privatiLavoriAnni = {}; }
try{ const raw = localStorage.getItem('gv_leleLavoriAnni'); DB.leleLavoriAnni = raw ? JSON.parse(raw) : {}; }catch(e){ DB.leleLavoriAnni = {}; }
try{ const raw = localStorage.getItem('gv_benzinaAnni'); DB.benzinaAnni = raw ? JSON.parse(raw) : {}; }catch(e){ DB.benzinaAnni = {}; }
try{ const raw = localStorage.getItem('gv_sciAnni'); DB.sciAnni = raw ? JSON.parse(raw) : {}; }catch(e){ DB.sciAnni = {}; }
try{ const raw = localStorage.getItem('gv_sciStagioni'); DB.sciStagioni = raw ? JSON.parse(raw) : {}; }catch(e){ DB.sciStagioni = {}; }
try{ const raw = localStorage.getItem('gv_sciPagamenti'); DB.sciPagamenti = raw ? JSON.parse(raw) : {}; }catch(e){ DB.sciPagamenti = {}; }
try{ const raw = localStorage.getItem('gv_fattureAnni'); DB.fattureAnni = raw ? JSON.parse(raw) : {}; }catch(e){ DB.fattureAnni = {}; }
try{ const raw = localStorage.getItem('gv_fattureLeleAnni'); DB.fattureLeleAnni = raw ? JSON.parse(raw) : {}; }catch(e){ DB.fattureLeleAnni = {}; }
try{ const raw = localStorage.getItem('gv_privatiAccontiAnni'); DB.privatiAccontiAnni = raw ? JSON.parse(raw) : {}; }catch(e){ DB.privatiAccontiAnni = {}; }
try{ const raw = localStorage.getItem('gv_neveStagioni'); DB.neveStagioni = raw ? JSON.parse(raw) : {}; }catch(e){ DB.neveStagioni = {}; }
try{ const raw = localStorage.getItem('gv_fattureNeveStagioni'); DB.fattureNeveStagioni = raw ? JSON.parse(raw) : {}; }catch(e){ DB.fattureNeveStagioni = {}; }

// esclusione una tantum dal resoconto contabile richiesta dall'utente
(function escludiCondominiRichiesti(){
  try{
    if(localStorage.getItem('gv_esclusioneFatta1')) return;
    const daEscludere = ['villa jole', 'gegia martinet', 'villa cascina rossa'];
    let cambiato = false;
    DB.condomini.forEach(c=>{
      const nomeNorm = (c.nome||'').trim().toLowerCase();
      if(daEscludere.some(n=> nomeNorm===n || nomeNorm.includes(n))){
        c.escludiResoconto = true;
        cambiato = true;
      }
    });
    if(cambiato) localStorage.setItem('gv_condomini', JSON.stringify(DB.condomini));
    localStorage.setItem('gv_esclusioneFatta1', '1');
  }catch(e){ console.error('esclusione condomini fallita', e); }
})();
(function escludiCondominiRichiesti2(){
  try{
    if(localStorage.getItem('gv_esclusioneFatta2')) return;
    const daEscludere = ['gegia', 'martinet'];
    let cambiato = false;
    DB.condomini.forEach(c=>{
      const nomeNorm = (c.nome||'').trim().toLowerCase();
      if(daEscludere.some(n=> nomeNorm===n || nomeNorm.includes(n))){
        c.escludiResoconto = true;
        cambiato = true;
      }
    });
    if(cambiato) localStorage.setItem('gv_condomini', JSON.stringify(DB.condomini));
    localStorage.setItem('gv_esclusioneFatta2', '1');
  }catch(e){ console.error('esclusione condomini fallita', e); }
})();
(function escludiClientiPrivatiRichiesti(){
  try{
    if(localStorage.getItem('gv_esclusionePrivatiFatta1')) return;
    const daEscludere = ['villa jole', 'villa cascina rossa', 'gegia', 'martinet'];
    let cambiato = false;
    DB.privatiClienti.forEach(c=>{
      const nomeNorm = (c.nome||'').trim().toLowerCase();
      if(daEscludere.some(n=> nomeNorm===n || nomeNorm.includes(n))){
        c.escludiResoconto = true;
        cambiato = true;
      }
    });
    if(cambiato) localStorage.setItem('gv_privatiClienti', JSON.stringify(DB.privatiClienti));
    localStorage.setItem('gv_esclusionePrivatiFatta1', '1');
  }catch(e){ console.error('esclusione clienti privati fallita', e); }
})();
(function reinserisciNelResocontoRichiesti(){
  try{
    if(localStorage.getItem('gv_reinserimentoFatta1')) return;
    const daReinserire = ['villa jole', 'villa cascina rossa', 'gegia', 'martinet'];
    let cambiatoCondo = false, cambiatoPriv = false;
    DB.condomini.forEach(c=>{
      const nomeNorm = (c.nome||'').trim().toLowerCase();
      if(daReinserire.some(n=> nomeNorm===n || nomeNorm.includes(n)) && c.escludiResoconto){
        c.escludiResoconto = false;
        cambiatoCondo = true;
      }
    });
    DB.privatiClienti.forEach(c=>{
      const nomeNorm = (c.nome||'').trim().toLowerCase();
      if(daReinserire.some(n=> nomeNorm===n || nomeNorm.includes(n)) && c.escludiResoconto){
        c.escludiResoconto = false;
        cambiatoPriv = true;
      }
    });
    if(cambiatoCondo) localStorage.setItem('gv_condomini', JSON.stringify(DB.condomini));
    if(cambiatoPriv) localStorage.setItem('gv_privatiClienti', JSON.stringify(DB.privatiClienti));
    localStorage.setItem('gv_reinserimentoFatta1', '1');
  }catch(e){ console.error('reinserimento resoconto fallito', e); }
})();
(function contaComePrivatoRichiesti(){
  try{
    if(localStorage.getItem('gv_contaPrivatoFatta1')) return;
    const daContareComePrivato = ['villa jole', 'villa cascina rossa', 'martinet', 'gegia'];
    let cambiato = false;
    DB.condomini.forEach(c=>{
      const nomeNorm = (c.nome||'').trim().toLowerCase();
      if(daContareComePrivato.some(n=> nomeNorm===n || nomeNorm.includes(n))){
        c.contaComePrivato = true;
        cambiato = true;
      }
    });
    if(cambiato) localStorage.setItem('gv_condomini', JSON.stringify(DB.condomini));
    localStorage.setItem('gv_contaPrivatoFatta1', '1');
  }catch(e){ console.error('conta come privato fallito', e); }
})();

let annoAttivo = null;
try{ const raw = localStorage.getItem('gv_annoAttivo'); annoAttivo = raw ? JSON.parse(raw) : null; }catch(e){ annoAttivo = null; }
let stagioneSci = null;
try{ const raw = localStorage.getItem('gv_stagioneSci'); stagioneSci = raw ? JSON.parse(raw) : null; }catch(e){ stagioneSci = null; }
let stagioneAttiva = null;
try{ const raw = localStorage.getItem('gv_stagioneAttiva'); stagioneAttiva = raw ? JSON.parse(raw) : null; }catch(e){ stagioneAttiva = null; }

function calcolaStagioneDa(dataISO){
  const d = dataISO ? new Date(dataISO+'T00:00:00') : new Date();
  const mese = d.getMonth()+1; // 1-12
  const anno = d.getFullYear();
  // da settembre a dicembre la stagione "inizia" quest'anno e finisce l'anno dopo.
  // da gennaio ad agosto la stagione è iniziata l'anno precedente.
  return mese>=9 ? `${anno}/${anno+1}` : `${anno-1}/${anno}`;
}

function persist(k){
  try{
    const redirect = {interventi:'interventiAnni', privatiLavori:'privatiLavoriAnni', leleLavori:'leleLavoriAnni', benzina:'benzinaAnni', sci:'sciStagioni', fatture:'fattureAnni', fattureLele:'fattureLeleAnni', privatiAcconti:'privatiAccontiAnni', neve:'neveStagioni', fattureNeve:'fattureNeveStagioni'};
    const realKey = redirect[k] || k;
    localStorage.setItem('gv_'+realKey, JSON.stringify(DB[realKey]));
  }catch(e){ console.error(e); }
}
function persistAnnoAttivo(){ try{ localStorage.setItem('gv_annoAttivo', JSON.stringify(annoAttivo)); }catch(e){ console.error(e); } }
function persistStagioneSci(){ try{ localStorage.setItem('gv_stagioneSci', JSON.stringify(stagioneSci)); }catch(e){ console.error(e); } }
function persistStagioneAttiva(){ try{ localStorage.setItem('gv_stagioneAttiva', JSON.stringify(stagioneAttiva)); }catch(e){ console.error(e); } }

// DB.interventi / DB.privatiLavori / DB.benzina / DB.fatture puntano sempre al contenitore dell'anno attivo,
// così tutto il resto del codice continua a funzionare senza modifiche: cambia solo cosa c'è "dentro".
Object.defineProperty(DB, 'interventi', {
  get(){ if(!DB.interventiAnni[annoAttivo]) DB.interventiAnni[annoAttivo]=[]; return DB.interventiAnni[annoAttivo]; },
  set(v){ DB.interventiAnni[annoAttivo] = v; }
});
Object.defineProperty(DB, 'privatiLavori', {
  get(){ if(!DB.privatiLavoriAnni[annoAttivo]) DB.privatiLavoriAnni[annoAttivo]=[]; return DB.privatiLavoriAnni[annoAttivo]; },
  set(v){ DB.privatiLavoriAnni[annoAttivo] = v; }
});
Object.defineProperty(DB, 'leleLavori', {
  get(){ if(!DB.leleLavoriAnni[annoAttivo]) DB.leleLavoriAnni[annoAttivo]=[]; return DB.leleLavoriAnni[annoAttivo]; },
  set(v){ DB.leleLavoriAnni[annoAttivo] = v; }
});
Object.defineProperty(DB, 'sci', {
  get(){ if(!DB.sciStagioni[stagioneSci]) DB.sciStagioni[stagioneSci]=[]; return DB.sciStagioni[stagioneSci]; },
  set(v){ DB.sciStagioni[stagioneSci] = v; }
});
Object.defineProperty(DB, 'sciPag', {
  get(){ if(!DB.sciPagamenti[stagioneSci]) DB.sciPagamenti[stagioneSci]={}; return DB.sciPagamenti[stagioneSci]; },
  set(v){ DB.sciPagamenti[stagioneSci] = v; }
});
Object.defineProperty(DB, 'benzina', {
  get(){ if(!DB.benzinaAnni[annoAttivo]) DB.benzinaAnni[annoAttivo]=[]; return DB.benzinaAnni[annoAttivo]; },
  set(v){ DB.benzinaAnni[annoAttivo] = v; }
});
Object.defineProperty(DB, 'fatture', {
  get(){ if(!DB.fattureAnni[annoAttivo]) DB.fattureAnni[annoAttivo]=[]; return DB.fattureAnni[annoAttivo]; },
  set(v){ DB.fattureAnni[annoAttivo] = v; }
});
Object.defineProperty(DB, 'fattureLele', {
  get(){ if(!DB.fattureLeleAnni[annoAttivo]) DB.fattureLeleAnni[annoAttivo]=[]; return DB.fattureLeleAnni[annoAttivo]; },
  set(v){ DB.fattureLeleAnni[annoAttivo] = v; }
});
Object.defineProperty(DB, 'privatiAcconti', {
  get(){ if(!DB.privatiAccontiAnni[annoAttivo]) DB.privatiAccontiAnni[annoAttivo]=[]; return DB.privatiAccontiAnni[annoAttivo]; },
  set(v){ DB.privatiAccontiAnni[annoAttivo] = v; }
});
Object.defineProperty(DB, 'neve', {
  get(){ if(!DB.neveStagioni[stagioneAttiva]) DB.neveStagioni[stagioneAttiva]=[]; return DB.neveStagioni[stagioneAttiva]; },
  set(v){ DB.neveStagioni[stagioneAttiva] = v; }
});
Object.defineProperty(DB, 'fattureNeve', {
  get(){ if(!DB.fattureNeveStagioni[stagioneAttiva]) DB.fattureNeveStagioni[stagioneAttiva]=[]; return DB.fattureNeveStagioni[stagioneAttiva]; },
  set(v){ DB.fattureNeveStagioni[stagioneAttiva] = v; }
});

// migrazione una tantum: recupera qualunque dato dalle vecchie versioni (formato piatto, o anni
// archiviati "chiusi" col vecchio sistema) e li riversa nei contenitori per anno, senza perdere nulla.
(function migraDati(){
  try{
    if(localStorage.getItem('gv_migrazioneAnniFatta')) return;

    // 1) eventuale vecchissimo formato privati piatto (senza cartelle cliente)
    let clientiExtra = [];
    let lavoriDaVecchioFormato = [];
    const rawPrivatiVecchi = localStorage.getItem('gv_privati');
    if(rawPrivatiVecchi){
      const vecchi = JSON.parse(rawPrivatiVecchi) || [];
      const mappa = {};
      vecchi.forEach(v=>{
        const chiave = (v.cliente||'Cliente').trim().toLowerCase();
        let clienteId = mappa[chiave];
        if(!clienteId){
          const esistente = DB.privatiClienti.find(c=>(c.nome||'').trim().toLowerCase()===chiave);
          clienteId = esistente ? esistente.id : uid();
          mappa[chiave] = clienteId;
          if(!esistente) clientiExtra.push({ id:clienteId, nome:v.cliente||'Cliente', indirizzo:v.indirizzo||'', telefono:'', note:'' });
        }
        lavoriDaVecchioFormato.push({
          id: v.id || uid(), clienteId, data: v.data || todayISO(), descrizione: v.descrizione || '',
          durataOre: v.durataOre != null ? v.durataOre : null, macchinaId: v.macchinaId || null,
          oreMacchina: v.oreMacchina != null ? v.oreMacchina : null, note: v.note || '',
          stato: v.stato || 'Da fare', importo: v.importo || '',
        });
      });
    }
    if(clientiExtra.length){ DB.privatiClienti = DB.privatiClienti.concat(clientiExtra); persist('privatiClienti'); }

    // helper: converte una voce privato in formato con clienteId, creando il cliente se manca
    function normalizzaLavoroPrivato(v){
      if(v.clienteId) return v;
      const nome = v.clienteNome || v.cliente || 'Cliente';
      const chiave = nome.trim().toLowerCase();
      let cliente = DB.privatiClienti.find(c=>(c.nome||'').trim().toLowerCase()===chiave);
      if(!cliente){
        cliente = { id:uid(), nome, indirizzo:v.indirizzo||'', telefono:'', note:'' };
        DB.privatiClienti.push(cliente);
      }
      return {...v, clienteId: cliente.id};
    }

    // 2) dati "correnti" rimasti fuori da un archivio (formato subito precedente a questo aggiornamento)
    const legacyInterventi = JSON.parse(localStorage.getItem('gv_interventi') || '[]');
    const legacyPrivatiLavoriFlat = JSON.parse(localStorage.getItem('gv_privatiLavori') || '[]').concat(lavoriDaVecchioFormato);
    const legacyBenzina = JSON.parse(localStorage.getItem('gv_benzina') || '[]');
    const legacyArchivio = JSON.parse(localStorage.getItem('gv_archivio') || '[]');

    // 3) ogni anno già "chiuso" col vecchio sistema torna un contenitore modificabile
    legacyArchivio.forEach(a=>{
      const anno = String(a.anno);
      DB.interventiAnni[anno] = (DB.interventiAnni[anno]||[]).concat(a.interventi||[]);
      DB.privatiLavoriAnni[anno] = (DB.privatiLavoriAnni[anno]||[]).concat((a.privati||[]).map(normalizzaLavoroPrivato));
      DB.benzinaAnni[anno] = (DB.benzinaAnni[anno]||[]).concat(a.benzina||[]);
    });
    if(clientiExtra.length===0){
      // eventuali clienti creati durante la normalizzazione dei privati archiviati vanno comunque salvati
      persist('privatiClienti');
    }

    // 4) i dati rimasti "correnti" confluiscono nell'anno più recente appena chiuso, se c'è, altrimenti nell'anno solare in corso
    const annoDestinazione = legacyArchivio.length ? String(legacyArchivio[0].anno) : String(new Date().getFullYear());
    if(legacyInterventi.length) DB.interventiAnni[annoDestinazione] = (DB.interventiAnni[annoDestinazione]||[]).concat(legacyInterventi);
    if(legacyPrivatiLavoriFlat.length) DB.privatiLavoriAnni[annoDestinazione] = (DB.privatiLavoriAnni[annoDestinazione]||[]).concat(legacyPrivatiLavoriFlat.map(normalizzaLavoroPrivato));
    if(legacyBenzina.length) DB.benzinaAnni[annoDestinazione] = (DB.benzinaAnni[annoDestinazione]||[]).concat(legacyBenzina);

    if(!annoAttivo) annoAttivo = annoDestinazione;
    if(!DB.interventiAnni[annoAttivo]) DB.interventiAnni[annoAttivo] = [];
    if(!DB.privatiLavoriAnni[annoAttivo]) DB.privatiLavoriAnni[annoAttivo] = [];
    if(!DB.benzinaAnni[annoAttivo]) DB.benzinaAnni[annoAttivo] = [];

    persist('interventi'); persist('privatiLavori'); persist('benzina'); persist('privatiClienti'); persistAnnoAttivo();

    localStorage.setItem('gv_migrazioneAnniFatta', '1');
    localStorage.removeItem('gv_privati');
    localStorage.removeItem('gv_interventi');
    localStorage.removeItem('gv_privatiLavori');
    localStorage.removeItem('gv_benzina');
    localStorage.removeItem('gv_archivio');
  }catch(e){ console.error('migrazione dati fallita', e); }
})();

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtData(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtDataLunga(){
  return new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
}
function giorniDa(iso){
  if(!iso) return null;
  const d = new Date(iso+'T00:00:00'); const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((now-d)/86400000);
}
const TARIFFA_ORARIA = 20;
function estraiEuroDalleNote(note){
  if(!note) return 0;
  const matches = note.match(/(\d+(?:[.,]\d+)?)\s*€/g) || [];
  return matches.reduce((sum,m)=>{
    const num = parseFloat(m.replace('€','').replace(',','.').trim());
    return sum + (isNaN(num)?0:num);
  },0);
}
function calcolaTotale(l){
  const manodopera = ((Number(l.durataOre)||0) + (Number(l.oreAcquisto)||0)) * TARIFFA_ORARIA + (Number(l.preventivoFisso)||0);
  const materiali = estraiEuroDalleNote(l.note);
  const extra = Number(l.importo)||0;
  return {manodopera, materiali, extra, totale: manodopera+materiali+extra};
}
function stilePillPrivato(stato){
  if(stato==='Saldato') return 'background:var(--forest); color:#fff;';

  if(stato==='In corso') return 'background:var(--ochre-light); color:var(--ochre);';
  return 'background:var(--line); color:var(--forest);';
}
function prioritaCartellaCliente(lavori){
  if(lavori.length===0) return 3;
  const inLavorazione = lavori.some(l=> l.stato==='Da preventivare' || l.stato==='Da fare' || l.stato==='In corso');
  if(inLavorazione) return 0;
  const completato = lavori.some(l=> l.stato==='Completato');
  if(completato) return 1;
  return 2;
}
function coloreCartellaCliente(lavori){
  if(lavori.length===0) return null;
  const inLavorazione = lavori.some(l=> l.stato==='Da preventivare' || l.stato==='Da fare' || l.stato==='In corso');
  if(inLavorazione) return 'var(--ochre)';
  const completato = lavori.some(l=> l.stato==='Completato');
  if(completato) return '#E4392E';
  return 'var(--verde-saldo)';
}
function tipiDi(i){ return i.tipi && i.tipi.length ? i.tipi : (i.tipo ? [i.tipo] : []); }
function tariffaOrariaDaNote(note){
  if(!note) return 0;
  const m = note.match(/(\d+(?:[.,]\d+)?)\s*€/);
  if(!m) return 0;
  const num = parseFloat(m[1].replace(',','.'));
  return isNaN(num) ? 0 : num;
}
function calcolaAltro(interventi){
  const soloAltro = interventi.filter(i=> tipiDi(i).includes('Altro'));
  let ore = 0, importo = 0;
  soloAltro.forEach(i=>{
    const oreInt = (Number(i.durataOre)||0) + (Number(i.oreAcquisto)||0);
    ore += oreInt;
    importo += oreInt * tariffaOrariaDaNote(i.noteAltro);
  });
  return {ore, importo};
}
function macchineDi(i){ return i.macchine && i.macchine.length ? i.macchine : (i.macchinaId ? [{macchinaId:i.macchinaId, ore:i.oreMacchina}] : []); }
function prezzoMedioLitro(){
  const conLitri = DB.benzina.filter(b=> Number(b.litri)>0 && Number(b.importo)>0);
  const litriTot = conLitri.reduce((s,b)=> s+Number(b.litri), 0);
  const importoTot = conLitri.reduce((s,b)=> s+Number(b.importo), 0);
  return litriTot>0 ? importoTot/litriTot : 0;
}
function costoBenzinaInterventi(interventi){
  const prezzo = prezzoMedioLitro();
  if(!prezzo) return 0;
  return interventi.reduce((tot,i)=>{
    return tot + macchineDi(i).reduce((s,mr)=>{
      if(!mr.macchinaId || !mr.ore) return s;
      const m = DB.macchinari.find(x=>x.id===mr.macchinaId);
      if(!m || !m.consumoLitriOra) return s;
      return s + (Number(mr.ore) * Number(m.consumoLitriOra) * prezzo);
    }, 0);
  }, 0);
}
function ultimoTaglioDi(condominioId){
  const dates = DB.interventi.filter(i=>i.condominioId===condominioId && tipiDi(i).includes('Taglio erba')).map(i=>i.data).sort();
  return dates.length ? dates[dates.length-1] : null;
}
function statoCondo(c){
  const ultimo = ultimoTaglioDi(c.id);
  if(!ultimo) return {pct:1.3, giorni:null, stato:'scaduto', ultimo:null};
  const giorni = giorniDa(ultimo); const freq = c.frequenzaGiorni||21;
  const pct = giorni/freq; let st='ok';
  if(pct>=1) st='scaduto'; else if(pct>=0.72) st='quasi';
  return {pct, giorni, stato:st, ultimo};
}
function barColor(stato){ return stato==='scaduto' ? 'var(--rust)' : stato==='quasi' ? 'var(--ochre)' : 'var(--sage)'; }
function pill(stato){
  if(stato==='scaduto') return '<span class="pill pill-rust">DA TAGLIARE</span>';
  if(stato==='quasi') return '<span class="pill pill-ochre">in scadenza</span>';
  return '<span class="pill pill-sage">ok</span>';
}
function bar(pct, stato){
  const w = Math.min(100, Math.max(4, pct*100));
  return `<div class="bar"><div class="bar-fill" style="width:${w}%; background:${barColor(stato)}"></div></div>`;
}

// ---- Promemoria ultima fattura: calcolato dalle fatture salvate, riparte da 0 a ogni anno solare nuovo ----
function leggiUltimaFattura(){
  const annoReale = new Date().getFullYear();
  const tutte = [];
  [DB.fattureAnni, DB.fattureLeleAnni, DB.fattureNeveStagioni].forEach(gruppo=>{
    Object.values(gruppo||{}).forEach(arr=> (arr||[]).forEach(f=> tutte.push(f)));
  });
  let max = 0;
  tutte.forEach(f=>{
    const m = String(f.numero||'').match(/^\s*(\d+)\s*(?:[\/\-.]\s*(\d{2,4}))?/);
    if(!m) return;
    const n = parseInt(m[1],10);
    let anno = parseInt((f.data||'').slice(0,4),10);
    if(m[2]) anno = m[2].length===2 ? 2000+parseInt(m[2],10) : parseInt(m[2],10);
    if(anno===annoReale && n>max) max = n;
  });
  return {anno:String(annoReale), numero:max};
}

function apriBackup(){
  const gg = giorniDalBackup();
  openSheet('Backup dati', htmlCloud() + `
    <div style="font-size:13px; color:var(--ink-soft); margin-bottom:14px; line-height:1.5">
      I dati sono salvati solo su questo telefono. Se cambi telefono o cancelli i dati del browser li perdi: fai un backup ogni tanto: copialo e incollalo in una nota o in un messaggio a te stesso. ${gg===null?'Non hai ancora fatto nessun backup.':`Ultimo backup: ${gg===0?'oggi':gg+' giorni fa'}.`}
    </div>
    <button class="btn btn-primary" style="margin-bottom:10px" onclick="copiaBackup()">📋 Copia backup</button>
    <textarea class="input" id="f-backup-copia" rows="4" readonly style="display:none; font-size:12px; margin-bottom:10px"></textarea>
    <div style="margin-bottom:18px"></div>
    <div class="field"><div class="field-label">Ripristina da backup</div>
      <input type="file" id="f-backup-file" accept=".json,application/json,text/plain" onchange="caricaBackupDaFile(this)" style="margin-bottom:8px; font-size:13px">
      <textarea class="input" id="f-backup-testo" rows="4" placeholder="oppure incolla qui il testo del backup" style="font-size:12px"></textarea>
    </div>
    <button class="btn btn-ghost" onclick="chiediRipristino()">Ripristina</button>
  `);
}
async function copiaBackup(){
  const txt = creaBackupTesto();
  let ok = false;
  try{ await navigator.clipboard.writeText(txt); ok = true; }catch(e){}
  if(!ok){
    try{
      const ta = document.createElement('textarea'); ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
      ok = document.execCommand('copy'); ta.remove();
    }catch(e){}
  }
  if(ok){ segnaBackupFatto(); toast('Backup copiato: incollalo in una nota o in un messaggio a te stesso'); }
  else{
    const box = document.getElementById('f-backup-copia');
    if(box){ box.value = txt; box.style.display = 'block'; box.focus(); box.select(); box.setSelectionRange(0, txt.length); }
    segnaBackupFatto();
    toast('Tieni premuto sul testo, scegli Seleziona tutto e poi Copia');
  }
}
function caricaBackupDaFile(input){
  const f = input.files && input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ document.getElementById('f-backup-testo').value = String(r.result||''); };
  r.onerror = ()=> toast('Impossibile leggere il file');
  r.readAsText(f);
}
let backupDaRipristinare = null;
function chiediRipristino(){
  const txt = (document.getElementById('f-backup-testo').value||'').trim();
  let b = null;
  try{ b = JSON.parse(txt); }catch(e){}
  if(!b || b.app!=='gestionale-verde' || !b.dati || typeof b.dati!=='object'){ toast('Backup non valido: controlla di aver incollato tutto il testo'); return; }
  backupDaRipristinare = b;
  const quando = b.creato ? fmtData(String(b.creato).slice(0,10)) : 'data sconosciuta';
  openSheet('Ripristina backup', `
    <div style="font-size:14px; line-height:1.5; margin-bottom:16px">
      Il backup è del <b>${esc(quando)}</b>. Ripristinandolo, tutti i dati che hai ora su questo telefono vengono <b>sostituiti</b> da quelli del backup.
    </div>
    <button class="btn btn-primary" style="margin-bottom:10px" onclick="eseguiRipristino()">Sì, sostituisci tutto</button>
    <button class="btn btn-ghost" onclick="closeSheet()">Annulla</button>
  `);
}
function eseguiRipristino(){
  const b = backupDaRipristinare; if(!b) return;
  try{
    localStorage.setItem('sync_forcePush','1');
    const vecchie = [];
    for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k && k.indexOf('gv_')===0 && k!==CHIAVE_ULTIMO_BACKUP) vecchie.push(k); }
    vecchie.forEach(k=> localStorage.removeItem(k));
    Object.keys(b.dati).forEach(k=>{ if(k.indexOf('gv_')===0 && typeof b.dati[k]==='string') localStorage.setItem(k, b.dati[k]); });
    segnaBackupFatto();
    location.reload();
  }catch(e){ console.error(e); toast('Ripristino non riuscito'); }
}

// Stagione del taglio erba: finisce il 15 novembre, riapre il 15 aprile
function stagioneTaglioFinita(){
  const d = new Date(); const m = d.getMonth()+1, g = d.getDate();
  return (m===11 && g>=15) || m===12 || m<=3 || (m===4 && g<15);
}

function saveIntervento(){
  const idVal = document.getElementById('f-id').value;
  const isEdit = !!idVal;
  const condominioId = document.getElementById('f-condo').value;
  if(!condominioId) return;
  const tipi = Array.from(document.querySelectorAll('.tipo-chip input:checked')).map(i=>i.value);
  if(tipi.length===0){ toast('Seleziona almeno un tipo di intervento'); return; }
  const data = document.getElementById('f-data').value || todayISO();
  const note = document.getElementById('f-note').value;
  const noteAltro = document.getElementById('f-note-altro').value;
  const durataVal = document.getElementById('f-durata').value;
  const durataOre = durataVal ? Number(durataVal) : null;
  const oreAcquistoVal = document.getElementById('f-ore-acquisto').value;
  const oreAcquisto = oreAcquistoVal ? Number(oreAcquistoVal) : null;
  const macchine = Array.from(document.querySelectorAll('#macchine-rows .macchina-row')).map(row=>{
    const sel = row.querySelector('select');
    const oreInput = row.querySelector('input');
    return { macchinaId: sel.value || null, ore: oreInput.value ? Number(oreInput.value) : null };
  }).filter(r=> r.macchinaId && r.ore);

  let oldCondominioId = null;
  if(isEdit){
    const oldRecord = DB.interventi.find(i=>i.id===idVal);
    if(oldRecord){
      oldCondominioId = oldRecord.condominioId;
      macchineDi(oldRecord).forEach(mr=>{
        if(!mr.macchinaId || !mr.ore) return;
        const m = DB.macchinari.find(m=>m.id===mr.macchinaId);
        if(m) m.contatoreOre = Math.max(0, (Number(m.contatoreOre)||0) - Number(mr.ore));
      });
    }
  }

  const record = {id: isEdit?idVal:uid(), condominioId, tipi, data, note, noteAltro, durataOre, oreAcquisto, macchine};
  if(isEdit){
    const idx = DB.interventi.findIndex(i=>i.id===idVal);
    if(idx>=0) DB.interventi[idx] = record;
  } else {
    DB.interventi.unshift(record);
  }
  persist('interventi');

  macchine.forEach(mr=>{
    const m = DB.macchinari.find(m=>m.id===mr.macchinaId);
    if(m){ m.contatoreOre = (Number(m.contatoreOre)||0) + mr.ore; }
  });
  persist('macchinari');

  closeSheet();
  render();
}

function saveCondo(){
  const id = document.getElementById('f-id').value || uid();
  const nome = document.getElementById('f-nome').value.trim();
  if(!nome) return;
  const data = {
    id, nome,
    indirizzo: document.getElementById('f-indirizzo').value,
    referente: document.getElementById('f-referente').value,
    telefono: document.getElementById('f-telefono').value,
    frequenzaGiorni: Number(document.getElementById('f-freq').value)||21,
    preventivo: document.getElementById('f-preventivo').value,
    preventivoNeve: document.getElementById('f-preventivo-neve').value,
    codiceUnivoco: document.getElementById('f-codice').value,
    escludiResoconto: document.getElementById('f-escludi').checked,
    contaComePrivato: document.getElementById('f-conta-privato').checked,
    note: document.getElementById('f-note').value,
  };
  const idx = DB.condomini.findIndex(c=>c.id===id);
  if(idx>=0) DB.condomini[idx]=data; else DB.condomini.push(data);
  persist('condomini');
  closeSheet(); render();
}
function delCondo(id){
  const c = DB.condomini.find(x=>x.id===id);
  const nome = c ? c.nome : 'questo condominio';
  openConfirm(`Eliminare "${esc(nome)}"? Verranno cancellati anche tutti gli interventi e le fatture collegate, e non si può annullare.`, function(){
    DB.condomini = DB.condomini.filter(c=>c.id!==id);
    DB.interventi = DB.interventi.filter(i=>i.condominioId!==id);
    DB.fatture = DB.fatture.filter(f=>f.condominioId!==id);
    DB.neve = DB.neve.filter(n=>n.condominioId!==id);
    DB.fattureNeve = DB.fattureNeve.filter(f=>f.condominioId!==id);
    persist('condomini'); persist('interventi'); persist('fatture'); persist('neve'); persist('fattureNeve');
    openCondoId=null; render();
  });
}
function moveCondo(id, dir){
  const idx = DB.condomini.findIndex(c=>c.id===id);
  const newIdx = idx+dir;
  if(idx<0 || newIdx<0 || newIdx>=DB.condomini.length) return;
  const tmp = DB.condomini[idx];
  DB.condomini[idx] = DB.condomini[newIdx];
  DB.condomini[newIdx] = tmp;
  persist('condomini');
  render();
}

function saveFattura(){
  const id = document.getElementById('f-id').value || uid();
  const condominioId = document.getElementById('f-condo-id').value;
  if(!condominioId) return;
  const idx = DB.fatture.findIndex(f=>f.id===id);
  const pagataEsistente = idx>=0 ? DB.fatture[idx].pagata : false;
  const data = {
    id, condominioId,
    numero: document.getElementById('f-numero').value,
    tipo: document.getElementById('f-tipo-fattura').value,
    data: document.getElementById('f-data').value || todayISO(),
    importo: document.getElementById('f-importo').value,
    note: document.getElementById('f-note').value,
    pagata: pagataEsistente,
  };
  if(idx>=0) DB.fatture[idx]=data; else DB.fatture.unshift(data);
  persist('fatture');
  closeSheet(); render();
}

function saveFatturaNeve(){

  const data = {

    tipo: document.getElementById('f-tipo-fattura').value,

}
function setPagataFatturaNeve(id, pagata){

function delFatturaNeve(id){
  DB.fattureNeve = DB.fattureNeve.filter(f=>f.id!==id);
  persist('fattureNeve');
  render();
}

// ---------- MACCHINE ----------
function renderMacchine(){
  let html = `<div class="page">
    <div class="display page-title">Macchinari</div>
    <div class="page-sub">${DB.macchinari.length} attrezzi</div>

  if(DB.macchinari.length===0){
    html += `<div class="empty">Aggiungi decespugliatore, tosaerba, motosega ecc. per tenere sotto controllo le ore e la manutenzione.</div>`;
  }

  DB.macchinari.forEach(m=>{
    const ore = Number(m.contatoreOre)||0;
    const base = Number(m.ultimaManutenzioneOre)||0;
    const soglia = Number(m.sogliaManutenzione)||50;
    const daUltima = ore-base;
    const pct = soglia ? daUltima/soglia : 0;
    const urgente = pct>=1, quasi = pct>=0.75 && !urgente;
    const stato = urgente?'scaduto':quasi?'quasi':'ok';
    html += `<div class="card">
      <div class="row-between">
        <div><div class="name">${esc(m.nome)}</div><div class="sub">${esc(m.tipo)}</div></div>
        ${urgente?'<span class="pill pill-rust">⚠ MANUTENZIONE</span>':quasi?'<span class="pill pill-ochre">quasi</span>':'<span class="pill pill-sage">ok</span>'}
      </div>
      <div style="font-size:13px;color:var(--ink-soft);margin:10px 0 0">⏱ ${ore}h totali · ${daUltima}h dall'ultima manutenzione (soglia ${soglia}h)${m.consumoLitriOra?` · ⛽ ${m.consumoLitriOra} L/h`:''}${m.capacitaOlio?` · 🛢 ${m.capacitaOlio}L olio`:''}</div>
      ${bar(pct, stato)}
      ${m.sogliaFiltroAria?(function(){
        const s = statoFiltro(m,'FiltroAria');
        return `<div style="margin-top:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-soft)">
            <span>🌬 Filtro aria: ${s.daUltima}h / ${s.soglia}h</span>
            ${s.urgente?'<span class="pill pill-rust" style="font-size:10px">da cambiare</span>':s.quasi?'<span class="pill pill-ochre" style="font-size:10px">quasi</span>':''}
          </div>
          ${bar(s.pct, s.urgente?'scaduto':s.quasi?'quasi':'ok')}
          <button class="btn btn-ghost" style="font-size:12px; padding:6px 10px; margin-top:4px" onclick="filtroSostituito('${m.id}','FiltroAria')">Filtro aria sostituito</button>
        </div>`;
      })():''}
      ${m.sogliaFiltroOlio?(function(){
        const s = statoFiltro(m,'FiltroOlio');
        return `<div style="margin-top:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-soft)">
            <span>🧴 Filtro olio: ${s.daUltima}h / ${s.soglia}h</span>
            ${s.urgente?'<span class="pill pill-rust" style="font-size:10px">da cambiare</span>':s.quasi?'<span class="pill pill-ochre" style="font-size:10px">quasi</span>':''}
          </div>
          ${bar(s.pct, s.urgente?'scaduto':s.quasi?'quasi':'ok')}
          <button class="btn btn-ghost" style="font-size:12px; padding:6px 10px; margin-top:4px" onclick="filtroSostituito('${m.id}','FiltroOlio')">Filtro olio sostituito</button>
        </div>`;
      })():''}
      <div style="display:flex;gap:8px">
        <input class="input" style="flex:1;padding:9px 10px" type="number" step="0.5" placeholder="+ ore" id="ore-${m.id}">
        <button class="btn btn-subtle btn-auto" onclick="aggiungiOre('${m.id}')">Aggiungi</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" style="font-size:13px" onclick="manutenzioneFatta('${m.id}')">Manutenzione fatta</button>
        <button class="btn btn-ghost btn-auto" style="padding:10px 12px" onclick="openMacchinaForm('${m.id}')">✎</button>
        <button class="btn btn-danger btn-auto" style="padding:10px 12px" onclick="delMacchina('${m.id}')">🗑</button>
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}
function aggiungiOre(id){
  const input = document.getElementById('ore-'+id);
  const val = Number(input.value);
  if(!val) return;
  const m = DB.macchinari.find(m=>m.id===id);
  m.contatoreOre = (Number(m.contatoreOre)||0) + val;
  persist('macchinari'); render();
}
function statoFiltro(m, prefix){
  const ore = Number(m.contatoreOre)||0;
  const base = Number(m['ultimaSost'+prefix])||0;
  const soglia = Number(m['soglia'+prefix])||0;
  const daUltima = ore-base;
  const pct = soglia ? daUltima/soglia : 0;
  return {daUltima, soglia, pct, urgente: pct>=1, quasi: pct>=0.75 && pct<1};
}
function filtroSostituito(id, prefix){
  const m = DB.macchinari.find(m=>m.id===id);
  if(m){ m['ultimaSost'+prefix] = m.contatoreOre; persist('macchinari'); render(); }
}
function manutenzioneFatta(id){
  const m = DB.macchinari.find(m=>m.id===id);
  m.ultimaManutenzioneOre = m.contatoreOre;
  persist('macchinari'); render();
}
function delMacchina(id){
  const m = DB.macchinari.find(x=>x.id===id);
  const nome = m ? m.nome : 'questo macchinario';
  openConfirm(`Eliminare "${esc(nome)}"? Non si può annullare.`, function(){
    DB.macchinari = DB.macchinari.filter(m=>m.id!==id);
    persist('macchinari'); render();
  });
}

  `);
}
function saveMacchina(){
  const id = document.getElementById('f-id').value || uid();
  const nome = document.getElementById('f-nome').value.trim();
  if(!nome) return;
  const data = {
    id, nome,
    tipo: document.getElementById('f-tipo').value,
    contatoreOre: Number(document.getElementById('f-ore').value)||0,
    ultimaManutenzioneOre: Number(document.getElementById('f-ultima').value)||0,
    sogliaManutenzione: Number(document.getElementById('f-soglia').value)||50,
    sogliaFiltroAria: document.getElementById('f-soglia-aria').value ? Number(document.getElementById('f-soglia-aria').value) : null,
    ultimaSostFiltroAria: Number(document.getElementById('f-ultima-aria').value)||0,
    sogliaFiltroOlio: document.getElementById('f-soglia-olio').value ? Number(document.getElementById('f-soglia-olio').value) : null,
    ultimaSostFiltroOlio: Number(document.getElementById('f-ultima-olio').value)||0,

    capacitaOlio: document.getElementById('f-olio').value ? Number(document.getElementById('f-olio').value) : null,
    note: document.getElementById('f-note').value,
  };
  const idx = DB.macchinari.findIndex(m=>m.id===id);
  if(idx>=0) DB.macchinari[idx]=data; else DB.macchinari.push(data);
  persist('macchinari');
  closeSheet(); render();
}

function renderResocontoPrivati(){
  const clientiInclusi = DB.privatiClienti.filter(c=> !c.escludiResoconto);
  const idInclusi = new Set(clientiInclusi.map(c=>c.id));
  const lavoriInclusi = DB.privatiLavori.filter(l=> idInclusi.has(l.clienteId));

  const oreTotali = lavoriInclusi.reduce((s,l)=> s+(Number(l.durataOre)||0)+(Number(l.oreAcquisto)||0), 0);

  const acquistiTotale = lavoriInclusi.reduce((s,l)=> s+estraiEuroDalleNote(l.note), 0);
  const extraTotale = lavoriInclusi.reduce((s,l)=> s+(Number(l.importo)||0), 0);
  const totaleGenerale = manodoperaTotale + acquistiTotale + extraTotale;

  const nonSaldati = lavoriInclusi.filter(l=>l.stato!=='Saldato');
  const oreDaSaldare = nonSaldati.reduce((s,l)=> s+(Number(l.durataOre)||0)+(Number(l.oreAcquisto)||0), 0);
  const manodoperaDaSaldare = (oreDaSaldare * TARIFFA_ORARIA) + nonSaldati.reduce((s,l)=> s+(Number(l.preventivoFisso)||0), 0);
  const materialeDaSaldare = nonSaldati.reduce((s,l)=> s+estraiEuroDalleNote(l.note)+(Number(l.importo)||0), 0);
  const totaleDaSaldare = manodoperaDaSaldare + materialeDaSaldare;

  const condominiComePrivati = condominiOrdinati().filter(c=> c.contaComePrivato);
  const idCondominiComePrivati = new Set(condominiComePrivati.map(c=>c.id));
  const interventiCondominiComePrivati = DB.interventi.filter(i=> idCondominiComePrivati.has(i.condominioId));
  const preventivoCondomini = condominiComePrivati.reduce((s,c)=> s+(Number(c.preventivo)||0), 0);
  const oreCondomini = interventiCondominiComePrivati.reduce((s,i)=> s+(Number(i.durataOre)||0)+(Number(i.oreAcquisto)||0), 0);

  let html = `<div class="page">

    <div class="display page-title">Resoconto contabile</div>

    <div style="display:flex; gap:10px; margin-bottom:10px">
      <div class="card" style="flex:1"><div class="section-title" style="margin-bottom:4px">Ore totali</div>
        <div style="font-weight:700; font-size:18px; color:var(--forest-deep)">${oreTotali}h</div></div>
      <div class="card" style="flex:1"><div class="section-title" style="margin-bottom:4px">Manodopera</div>
        <div style="font-weight:700; font-size:18px; color:var(--forest-deep)">€ ${manodoperaTotale.toFixed(2)}</div></div>
    </div>
    <div style="display:flex; gap:10px; margin-bottom:20px">
      <div class="card" style="flex:1"><div class="section-title" style="margin-bottom:4px">Acquisti (dalle note)</div>
        <div style="font-weight:700; font-size:18px; color:var(--forest-deep)">€ ${acquistiTotale.toFixed(2)}</div></div>
      <div class="card" style="flex:1"><div class="section-title" style="margin-bottom:4px">Totale complessivo</div>
        <div style="font-weight:700; font-size:18px; color:var(--forest-deep)">€ ${totaleGenerale.toFixed(2)}</div></div>
    </div>

    <div style="background:var(--rust-light); border-radius:12px; padding:12px 14px; margin-bottom:14px">
      <div style="font-size:12px; font-weight:700; color:var(--rust); text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px">Da saldare (tutti i clienti)</div>
      <div style="display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--rust); margin-bottom:4px">
        <span>Manodopera: <b>€ ${manodoperaDaSaldare.toFixed(2)}</b></span>
        <span>Materiale: <b>€ ${materialeDaSaldare.toFixed(2)}</b></span>
      </div>
      <div style="font-size:17px; font-weight:700; color:var(--rust)">Totale: € ${totaleDaSaldare.toFixed(2)}</div>
    </div>

    ${condominiComePrivati.length ? `
    <div class="section-title" style="margin-bottom:8px">Condomini contati come privati (${condominiComePrivati.length})</div>
    <div class="card" style="margin-bottom:14px">
      <div class="sub" style="margin-bottom:10px">${condominiComePrivati.map(c=>esc(c.nome)).join(', ')} — restano visibili nella pagina Condomini</div>

function saveLavoro(){
  const id = document.getElementById('f-id').value || uid();
  const clienteId = document.getElementById('f-cliente-id').value;
  if(!clienteId) return;
  const durataVal = document.getElementById('f-durata').value;
  const macchinaId = document.getElementById('f-macchina').value || null;
  const oreVal = document.getElementById('f-ore').value;

  const idx = DB.privatiLavori.findIndex(l=>l.id===id);
  const isEdit = idx>=0;
  if(isEdit){
    const vecchio = DB.privatiLavori[idx];
    if(vecchio.macchinaId && vecchio.oreMacchina){
      const m = DB.macchinari.find(m=>m.id===vecchio.macchinaId);
      if(m) m.contatoreOre = Math.max(0, (Number(m.contatoreOre)||0) - Number(vecchio.oreMacchina));
    }
  }

  const data = {
    id, clienteId,
    descrizione: document.getElementById('f-descrizione').value,
    data: document.getElementById('f-data').value || todayISO(),
    durataOre: durataVal ? Number(durataVal) : null,
    oreAcquisto: document.getElementById('f-ore-acquisto').value ? Number(document.getElementById('f-ore-acquisto').value) : null,
    preventivoFisso: document.getElementById('f-preventivo-fisso').value ? Number(document.getElementById('f-preventivo-fisso').value) : null,
    macchinaId,
    oreMacchina: oreVal ? Number(oreVal) : null,
    stato: document.getElementById('f-stato').value,
    note: document.getElementById('f-note').value,
    importo: document.getElementById('f-importo').value,
  };
  if(isEdit) DB.privatiLavori[idx]=data; else DB.privatiLavori.unshift(data);
  persist('privatiLavori');

  if(macchinaId && data.oreMacchina){
    const m = DB.macchinari.find(m=>m.id===macchinaId);
    if(m){ m.contatoreOre = (Number(m.contatoreOre)||0) + data.oreMacchina; }
  }
  persist('macchinari');

  closeSheet(); render();
}

// ---------- calcolo "da fatturare" Lele ----------
// Il fatturato viene scalato dal totale dei lavori (dal più vecchio al più recente):
// se i lavori valgono 4650 e fatturi 4600, restano 50 € (e le relative ore) da fatturare.
function fmtOre(n){ return String(Math.round((Number(n)||0)*100)/100); }
function calcolaFatturazioneLele(){
  const costo = l => (Number(l.durataOre)||0)*TARIFFA_ORARIA + estraiEuroDalleNote(l.note) + (Number(l.importo)||0);
  const jobs = DB.leleLavori.slice().sort((a,b)=> (a.data||'')<(b.data||'') ? -1 : ((a.data||'')>(b.data||'') ? 1 : 0))
    .map(l=>({l, ore:Number(l.durataOre)||0, costo:costo(l), resto:costo(l)}));
  // la scelta fatta nell'intervento vince: "già fatturato" azzera il conto, "da fatturare" non può essere coperto da fatture precedenti
  jobs.forEach(j=>{ if(j.l.fatturato===true) j.resto = 0; });
  DB.fattureLele.slice().sort((a,b)=> (a.data||'')<(b.data||'') ? -1 : ((a.data||'')>(b.data||'') ? 1 : 0)).forEach(f=>{
    let imp = Number(f.importo)||0;
    for(const j of jobs){
      if(imp<=0.005) break;
      if(f.clienteId && j.l.clienteId!==f.clienteId) continue;
      if(j.l.fatturato===true) continue;
      if(j.l.fatturato===false && (j.l.data||'') > (f.data||'')) continue;
      if(j.resto<=0.005) continue;
      const x = Math.min(j.resto, imp);
      j.resto -= x; imp -= x;
    }
  });
  return jobs;
}
function statoLeleCliente(clienteId){
  const r = {ore:0, oreVecchie:0, oreTot:0, daFatturare:0, totaleLavori:0, byId:{}};
  calcolaFatturazioneLele().forEach(j=>{
    r.byId[j.l.id] = j;
    if(clienteId!=null && j.l.clienteId!==clienteId) return;
    const frac = j.costo>0.005 ? Math.min(1, Math.max(0, j.resto/j.costo)) : 1;
    r.ore += j.ore*frac; r.oreVecchie += j.ore*(1-frac); r.oreTot += j.ore;
    r.daFatturare += Math.max(0,j.resto); r.totaleLavori += j.costo;
  });
  return r;
}
function badgeFattLele(st, id){
  const j = st.byId[id];
  if(!j || j.costo<=0.005 || j.resto>=j.costo-0.005) return '';
  return j.resto<=0.005 ? ' · ✓ fatturato' : ` · fatturato in parte (€ ${j.resto.toFixed(2)} ancora da fatturare)`;
}

    html += `<div style="padding:0 14px 16px"><div class="collapsible-body">`;
    if(c.telefono || c.note){
      html += `<div style="font-size:13px;color:var(--ink-soft);margin-bottom:12px">${c.telefono?`📞 ${esc(c.telefono)}`:''}${c.telefono&&c.note?' · ':''}${c.note?esc(c.note):''}</div>`;
    }

    const manodoperaTotale = oreTotali * TARIFFA_ORARIA;
    const extraTotale = lavori.reduce((s,l)=> s+estraiEuroDalleNote(l.note)+(Number(l.importo)||0), 0);
    const totaleGenerale = manodoperaTotale + extraTotale;

    if(lavori.length>0){
      const box = (lab,val)=>`<div style="flex:1"><div class="section-title" style="margin-bottom:4px">${lab}</div>
          <div style="font-weight:700; font-size:16px; color:var(--forest-deep)">${val}</div></div>`;
      html += `<div style="font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;text-transform:uppercase">Riepilogo (anno ${annoAttivo})</div>
      <div style="display:flex; gap:10px; margin-bottom:10px">${box('Ore da fatturare', fmtOre(oreNuove)+'h')}${box('Ore già fatturate', fmtOre(st.oreVecchie)+'h')}</div>
      <div style="display:flex; gap:10px; margin-bottom:6px">${box('Da fatturare', '€ '+st.daFatturare.toFixed(2))}${box('Totale lavori', '€ '+totaleGenerale.toFixed(2))}</div>
      <div class="sub" style="margin-bottom:14px">Manodopera € ${manodoperaTotale.toFixed(2)} · utensili/extra € ${extraTotale.toFixed(2)}</div>`;
    }

    html += `<button class="btn btn-primary" style="margin-bottom:14px" onclick="openLavoroLeleForm('${c.id}', null)">＋ Nuovo intervento</button>`;

    if(lavori.length===0){
      html += `<div style="font-size:13px;color:var(--ink-soft);margin-bottom:8px">Nessun intervento ancora per questo cliente.</div>`;
    }

    lavori.forEach(l=>{
      const materiali = estraiEuroDalleNote(l.note);
      const extra = Number(l.importo)||0;
      const totaleLavoro = ((Number(l.durataOre)||0) * TARIFFA_ORARIA) + materiali + extra;
      html += `<div style="border-top:1px solid var(--line); padding:12px 0">
        <div class="row-between">
          <div>
            <div style="font-weight:700; font-size:14.5px">${fmtData(l.data)}</div>
            ${l.descrizione?`<div style="font-size:13.5px;margin-top:3px">${esc(l.descrizione)}</div>`:''}
            ${l.durataOre?`<div class="sub" style="margin-top:5px">${l.durataOre}h lavoro</div>`:''}
            ${l.note?`<div style="font-size:13px;margin-top:4px;color:var(--ink-soft)">📝 ${esc(l.note)}</div>`:''}
            ${totaleLavoro>0?`<div style="font-size:15px;margin-top:6px;font-weight:700;color:var(--forest-deep)">Totale: € ${totaleLavoro.toFixed(2)}${badgeFattLele(st,l.id)}</div>`:''}
          </div>
          <div style="display:flex; gap:4px; flex-shrink:0">
            <button class="close-btn" style="background:none" onclick="openLavoroLeleForm('${c.id}','${l.id}')">✎</button>
            <button class="close-btn" style="background:none" onclick="delLavoroLele('${l.id}')">🗑</button>
          </div>
        </div>
      </div>`;
    });

    html += `<div class="btn-row" style="margin-top:14px">
      <button class="btn btn-ghost" onclick="openClienteLeleForm('${c.id}')">✎ Modifica cliente</button>
      <button class="btn btn-danger" onclick="delClienteLele('${c.id}')">🗑 Elimina cliente</button>
    </div>`;
    html += `</div></div>`;
  }
  html += `</div>`;
  return html;
}

function contaEmergenza(){
  const tutti = obj => Object.values(obj||{}).reduce((n,a)=> n+(a||[]).length, 0);
  const nero = Object.values(DB.fattureLeleAnni||{}).reduce((n,a)=> n+(a||[]).filter(f=>f.metodo==='nero').length, 0);
  return {lavori: tutti(DB.privatiLavoriAnni), acconti: tutti(DB.privatiAccontiAnni), nero, clienti: DB.privatiClienti.length};
}

  openSheet('Pulizia dati', `

function eseguiEmergenza(){
  const v = (document.getElementById('em-conferma').value||'').trim().toUpperCase();
  if(v!=='ELIMINA'){ document.getElementById('em-errore').textContent = 'Scrivi ELIMINA per confermare.'; return; }

// ---------- TOTALI GENERALI ----------
let openTotaliId = null;
function renderTotaliFolder(id, nome, totale, righe){
  const isOpen = openTotaliId===id;
  return `<div class="card" style="padding:0; overflow:hidden">
    <button style="width:100%;background:none;border:none;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;text-align:left"
      onclick="openTotaliId = openTotaliId==='${id}' ? null : '${id}'; render()">
      <div>
        <div class="name">${nome}</div>
        <div class="sub">€ ${totale.toFixed(2)}</div>
      </div>
      <span class="chev ${isOpen?'open':''}">⌄</span>
    </button>
    ${isOpen?`<div style="padding:0 14px 16px"><div class="collapsible-body">${righe}</div></div>`:''}
  </div>`;
}
function renderTotali(){
  const somma = (arr, fn) => arr.reduce((s,x)=> s+(Number(fn(x))||0), 0);
  const imp = f => f.importo;

  // Condomini: fatture dell'anno (e della stagione neve attiva). Quelli "contati come privati" vanno nel gruppo dei privati
  const idCP = new Set(DB.condomini.filter(c=>c.contaComePrivato).map(c=>c.id));
  const fCond = DB.fatture.filter(f=> !idCP.has(f.condominioId));
  const fNeve = stagioneAttiva ? DB.fattureNeve.filter(f=> !idCP.has(f.condominioId)) : [];
  const fCondPriv = DB.fatture.filter(f=> idCP.has(f.condominioId)).concat(stagioneAttiva ? DB.fattureNeve.filter(f=> idCP.has(f.condominioId)) : []);
  const condTot = somma(fCond, imp), condInc = somma(fCond.filter(f=>f.pagata), imp);
  const neveTot = somma(fNeve, imp), neveInc = somma(fNeve.filter(f=>f.pagata), imp);
  const condPrivTot = somma(fCondPriv, imp), condPrivInc = somma(fCondPriv.filter(f=>f.pagata), imp);
  const nomiCP = DB.condomini.filter(c=>c.contaComePrivato).sort((a,b)=> String(a.nome||'').localeCompare(String(b.nome||''),'it',{sensitivity:'base'})).map(c=>esc(c.nome)).join(', ');

  // Lele: fatture per metodo di pagamento
  const lele = m => { const fs = DB.fattureLele.filter(f=>(f.metodo||'')===m);
    return {tot: somma(fs, imp), inc: somma(fs.filter(f=>f.pagata), imp)}; };
  const bon = lele('bonifico'), nero = lele('nero'), nd = lele('');

  // Privati: lavori saldati + acconti ricevuti (clienti non esclusi dal resoconto)
  const idPriv = new Set(DB.privatiClienti.filter(c=>!c.escludiResoconto).map(c=>c.id));
  const saldati = DB.privatiLavori.filter(l=> idPriv.has(l.clienteId) && l.stato==='Saldato');
  const oreSaldati = somma(saldati, l=> (Number(l.durataOre)||0)+(Number(l.oreAcquisto)||0));
  const saldatiTot = oreSaldati*TARIFFA_ORARIA + somma(saldati, l=>l.preventivoFisso) + somma(saldati, l=>estraiEuroDalleNote(l.note)) + somma(saldati, l=>l.importo);
  const accTot = somma(DB.privatiAcconti.filter(a=> idPriv.has(a.clienteId)), a=>a.importo);
  const privTot = saldatiTot + accTot;

  const sci = sciRiepilogo();
  const gruppoA = condTot + neveTot + bon.tot + sci.totale;
  const gruppoB = privTot + condPrivTot + nero.tot;

  const riga = (lab, val, sub) => `<div class="row-between" style="padding:10px 0; border-top:1px solid var(--line)">
      <div><div style="font-size:14px">${lab}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>
      <div style="font-weight:700; font-size:15px; color:var(--forest-deep); white-space:nowrap">€ ${val.toFixed(2)}</div></div>`;

  const righeA = riga('Fatture condomini', condTot, `incassato € ${condInc.toFixed(2)}`)
    + (stagioneAttiva ? riga('Fatture neve', neveTot, `incassato € ${neveInc.toFixed(2)}`) : '')
    + riga('Lele · bonifico', bon.tot, `incassato € ${bon.inc.toFixed(2)}`)
    + (sci.scuola.importo>0.005 ? riga('Scuola sci', sci.scuola.importo, `${fmtOre(sci.ore.scuola)} h × € ${sci.scuola.orario.toFixed(2)}/h`) : '')
    + (sci.sciclub.importo>0.005 ? riga('Sci club · contratto', sci.sciclub.importo, sci.sciclub.orario!==null ? `${fmtOre(sci.ore.sciclub)} h · € ${sci.sciclub.orario.toFixed(2)}/h` : '') : '')
    + (sci.extra.importo>0.005 ? riga('Sci club extra', sci.extra.importo, sci.extra.orario!==null ? `${fmtOre(sci.ore.extra)} h · € ${sci.extra.orario.toFixed(2)}/h` : '') : '');
  const righeB = riga('Privati · lavori saldati', saldatiTot)
    + riga('Privati · acconti ricevuti', accTot)
    + (idCP.size ? riga('Condomini contati come privati', condPrivTot, `${nomiCP} · incassato € ${condPrivInc.toFixed(2)}`) : '')
    + riga('Lele · in nero', nero.tot, `incassato € ${nero.inc.toFixed(2)}`)
    + `<button class="btn btn-ghost btn-auto" style="margin-top:14px; font-size:12px; padding:6px 12px; opacity:.7" onclick="openEmergenza()">⌫</button>`;

  return `<div class="page">
    <div class="display page-title">Totali</div>
    <div class="page-sub">anno ${annoAttivo}${` · neve ${esc(stagioneAttiva)} · sci ${esc(stagioneSci)}`}</div>
    <div class="card" style="display:flex; justify-content:space-between; align-items:center">
      <div>
        <div class="section-title" style="margin-bottom:4px">Anno di lavoro</div>
        <div class="name" style="font-size:20px">${annoAttivo}</div>
      </div>
      <button class="btn btn-subtle btn-auto" onclick="apriSelettoreAnno()">Cambia anno</button>
    </div>
    <div class="card" style="background:var(--sage-light); margin-bottom:16px">
      <div class="section-title" style="margin-bottom:4px">Totale complessivo</div>
      <div style="font-weight:700; font-size:22px; color:var(--forest-deep)">€ ${(gruppoA+gruppoB).toFixed(2)}</div>
      ${nd.tot>0.005?`<div class="sub" style="margin-top:6px">Escluse fatture Lele senza metodo scelto: € ${nd.tot.toFixed(2)}</div>`:''}
    </div>
    ${renderTotaliFolder('A', 'Condomini + bonifici Lele + sci', gruppoA, righeA)}
    ${renderTotaliFolder('B', 'Privati + nero Lele', gruppoB, righeB)}
  </div>`;
}

// ---------- REGISTRO CONTABILE LELE ----------
function renderResocontoLele(){
  const clienti = DB.leleClienti.slice().sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
  const righe = clienti.map(c=>{
    const st = statoLeleCliente(c.id);
    const fattureCliente = DB.fattureLele.filter(f=>f.clienteId===c.id && f.metodo!=='nero');
    const fatturato = fattureCliente.reduce((s,f)=> s+(Number(f.importo)||0), 0);
    const pagato = fattureCliente.filter(f=>f.pagata).reduce((s,f)=> s+(Number(f.importo)||0), 0);

      ${condominiOrdinati().map(c=>`<option value="${c.id}" ${filtroNeve===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}
    </select>`;

  if(DB.neve.length===0){
    html += `<div class="empty">Registra qui gli interventi di sgombero neve, spalatura e sale — separati dagli interventi di manutenzione del verde.</div>`;
  }

  const gruppi = condominiOrdinati()
    .map(c=>({ condo:c, items: DB.neve.filter(n=>n.condominioId===c.id) }))
    .filter(g=> filtroNeve==='tutti' || g.condo.id===filtroNeve);

  gruppi.forEach(g=>{
    if(g.items.length===0 && filtroNeve==='tutti' && !DB.fattureNeve.some(f=>f.condominioId===g.condo.id)) return;

  const idsValidi = new Set(DB.condomini.map(c=>c.id));
  if(filtroNeve==='tutti'){
    const orfani = DB.neve.filter(n=> !idsValidi.has(n.condominioId));
    if(orfani.length>0) html += renderGruppoNeve({id:'__orfani__', nome:'Condomini eliminati'}, orfani);

}

function editNeve(id){
  const n = DB.neve.find(x=>x.id===id);
  if(!n) return;
  openNeveForm(null, n);
}

function saveNeve(){
  const idVal = document.getElementById('f-id').value;
  const isEdit = !!idVal;
  const condominioId = document.getElementById('f-condo').value;
  if(!condominioId) return;
  const tipi = Array.from(document.querySelectorAll('.tipo-chip input:checked')).map(i=>i.value);
  if(tipi.length===0){ toast('Seleziona almeno un tipo'); return; }
  const data = document.getElementById('f-data').value || todayISO();
  const note = document.getElementById('f-note').value;
  const durataVal = document.getElementById('f-durata').value;
  const durataOre = durataVal ? Number(durataVal) : null;
  const macchine = Array.from(document.querySelectorAll('#macchine-rows .macchina-row')).map(row=>{
    const sel = row.querySelector('select');
    const oreInput = row.querySelector('input');
    return { macchinaId: sel.value || null, ore: oreInput.value ? Number(oreInput.value) : null };
  }).filter(r=> r.macchinaId && r.ore);

  if(isEdit){
    const vecchio = DB.neve.find(n=>n.id===idVal);
    if(vecchio){
      macchineDi(vecchio).forEach(mr=>{
        if(!mr.macchinaId || !mr.ore) return;
        const m = DB.macchinari.find(m=>m.id===mr.macchinaId);
        if(m) m.contatoreOre = Math.max(0, (Number(m.contatoreOre)||0) - Number(mr.ore));
      });
    }
  }

  const record = {id: isEdit?idVal:uid(), condominioId, tipi, data, note, durataOre, macchine};
  if(isEdit){
    const idx = DB.neve.findIndex(n=>n.id===idVal);
    if(idx>=0) DB.neve[idx] = record;
  } else {
    DB.neve.unshift(record);
  }
  persist('neve');

  macchine.forEach(mr=>{
    const m = DB.macchinari.find(m=>m.id===mr.macchinaId);
    if(m){ m.contatoreOre = (Number(m.contatoreOre)||0) + mr.ore; }
  });
  persist('macchinari');

  closeSheet();
  render();
}

function delCondoDaNeve(condoId){
  const condo = DB.condomini.find(c=>c.id===condoId);
  const nome = condo ? condo.nome : 'questo condominio';
  const interventi = DB.neve.filter(n=>n.condominioId===condoId);
  const fatture = DB.fattureNeve.filter(f=>f.condominioId===condoId);
  openConfirm(`Rimuovere "${nome}" dalla neve della stagione ${stagioneAttiva}? Verranno cancellati ${interventi.length} intervent${interventi.length===1?'o':'i'} e ${fatture.length} fattur${fatture.length===1?'a':'e'} neve di questa stagione (le ore macchina verranno ritolte). Il condominio resta in Condomini.`, function(){
    interventi.forEach(removed=>{
      macchineDi(removed).forEach(mr=>{
        if(!mr.macchinaId || !mr.ore) return;
        const m = DB.macchinari.find(m=>m.id===mr.macchinaId);
        if(m){ m.contatoreOre = Math.max(0, (Number(m.contatoreOre)||0) - Number(mr.ore)); }
      });
    });
    DB.neve = DB.neve.filter(n=>n.condominioId!==condoId);
    DB.fattureNeve = DB.fattureNeve.filter(f=>f.condominioId!==condoId);
    persist('neve'); persist('fattureNeve'); persist('macchinari');
    openNeveGroupId = null;
    if(filtroNeve===condoId) filtroNeve = 'tutti';
    render();
  });
}

function delNeve(id){
  openConfirm('Eliminare questo intervento di sgombero neve? Le ore eventualmente segnate sulle macchine verranno ritolte dal contatore.', function(){
    const removed = DB.neve.find(n=>n.id===id);
    DB.neve = DB.neve.filter(n=>n.id!==id);
    persist('neve');
    if(removed){
      const macchine = macchineDi(removed);
      if(macchine.length){
        macchine.forEach(mr=>{
          if(!mr.macchinaId || !mr.ore) return;
          const m = DB.macchinari.find(m=>m.id===mr.macchinaId);
          if(m){ m.contatoreOre = Math.max(0, (Number(m.contatoreOre)||0) - Number(mr.ore)); }
        });
        persist('macchinari');
      }
    }
    render();
  });
}

const CATEGORIE_SCI = [
  {id:'sciclub', label:'Sci club'},
  {id:'scuola',  label:'Scuola sci'},
  {id:'extra',   label:'Sci club extra'},
];
function labelSci(id){ const c = CATEGORIE_SCI.find(x=>x.id===id); return c ? c.label : 'Sci'; }

function sciRiepilogo(){
  const ore = {};
  CATEGORIE_SCI.forEach(c=>{ ore[c.id] = DB.sci.filter(x=>x.categoria===c.id).reduce((t,x)=> t+(Number(x.ore)||0), 0); });
  const p = DB.sciPag;
  const tariffa = Number(p.scuolaTariffa)||0, stip = Number(p.sciclubStipendio)||0, extra = Number(p.extraImporto)||0;
  return {
    ore,
    scuola:  { importo: tariffa*ore.scuola, orario: tariffa },
    sciclub: { importo: stip,  orario: ore.sciclub>0 ? stip/ore.sciclub : null },
    extra:   { importo: extra, orario: ore.extra>0 ? extra/ore.extra : null },
    totale: tariffa*ore.scuola + stip + extra
  };
}
function setSciPagamento(campo, valore){
  const v = String(valore).trim().replace(',','.');
  const n = v==='' ? null : Number(v);
  if(n!==null && !(n>=0)){ toast('Numero non valido'); render(); return; }
  DB.sciPag[campo] = n;
  persist('sciPagamenti');
  render();
}
